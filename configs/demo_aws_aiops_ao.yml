    sync: true

# EDA Rulebook Activations
eda_rulebook_activations:
  - name: "AWS AIOps AO: Lightspeed (Insights)"
    description: "AWS AIOps AO: Lightspeed (Insights) - Forwarder"
    organization: "Default"
    project: "AWS AIOps AO Project"
    rulebook: lightspeed_rulebook_ao.yml
    decision_environment: "{{ de_name }}"
    eda_credentials: "Controller Credentials"
    restart_policy: always
    force_restart: true
    ##enabled: false
    #state: disabled
    state: present
    log_level: info
