---

# Credentials
controller_credentials:
  - name: "AWS AIOps AO Ansible Credential"
    description: "AWS AIOps AO Ansible Credential"
    credential_type: "Machine"
    organization: "Default"
    inputs:
      password: "{{ rhel_password }}"
      username: "{{ rhel_user }}"

# Projects
controller_projects:
  - name: "AWS AIOps AO Project"
    description: "AWS AIOps AO Project"
    organization: "Default"
    scm_type: "git"
    scm_url: "{{ project_url }}"
    scm_update_on_launch: "False"
    #scm_update_on_launch: "True"
    execution_environment: "{{ ee_name }}"
    wait: true
  - name: "AWS AIOps AO Remediation Project"
    description: "AWS AIOps AO Remediation Project"
    organization: "Default"
    scm_type: "git"
    scm_url: "{{ github_url }}"
    scm_update_on_launch: "False"
    #scm_update_on_launch: "True"
    execution_environment: "{{ ee_name }}"
    wait: true            

