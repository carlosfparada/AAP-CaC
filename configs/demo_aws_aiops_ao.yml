    project: "AWS AIOps AO Project"
    inventory: "AWS Inventory"
    playbook: "aws_aiops_ao_deploy.yml"
    verbosity: 0
    job_type: "run"
    credentials:
      - "AWS Credential"
      - "AWS AIOps AO Ansible Credential"
    execution_environment: "{{ ee_name }}"
    survey_enabled: false
