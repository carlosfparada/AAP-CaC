---

# Credentials
controller_credentials:
  - name: "AWS Splunk Credential"
    description: "AWS Splunk Credential"
    credential_type: "Machine"
    organization: "Default"
    inputs:
      password: "{{ splunk_password }}"
      username: "{{ splunk_user }}"
  - name: "AWS Splunk Vault"
    description: "AWS Splunk Vault"
    credential_type: "Vault"
    organization: "Default"
    inputs:
      vault_password: "{{ splunk_vault_secret }}"

# Projects
controller_projects:
  - name: "AWS Splunk Project"
    description: "AWS Splunk Project"
    organization: "Default"
    scm_type: "git"
    scm_url: "{{ project_url }}"
    scm_update_on_launch: "True"
    execution_environment: "{{ ee_name }}"
    update_project: true
    wait: true

# Job Templates
controller_templates:
  - name: "AWS Splunk: 01. AWS Deploy"
    description: ""
    organization: "Default"
    project: "AWS Splunk Project"
    inventory: "AWS Inventory"
    playbook: "aws_deploy.yml"
    verbosity: 0
    job_type: "run"
    credentials:
      - "AWS Credential"
      - "AWS Splunk Credential"
    execution_environment: "{{ ee_name }}"
    survey_enabled: false
  - name: "AWS Splunk: 02. Setup"
    description: ""
    organization: "Default"
    project: "AWS Splunk Project"
    inventory: "AWS Inventory"
    playbook: "aws_splunk_setup.yml"
    verbosity: 0
    job_type: "run"
    credentials:
      - "AWS Credential"
      - "AWS Splunk Credential"
      - "AWS Splunk Vault"
    execution_environment: "{{ ee_name }}"
    survey_enabled: true
    survey:
        name: Survey
        description: Survey
        spec:
          - question_name: Subscription User
            default: "{{ subscription_user }}"
            variable: subscription_user
            type: "text"
            required: true
          - question_name: Subscription Password
            default: "{{ subscription_pass }}"
            variable: subscription_pass
            type: "password"
            required: true
          - question_name: Subscription Pool Id
            default: "{{ rh_subs_pool_id }}"
            variable: rh_subs_pool_id
            type: "password"
            required: true
          - question_name: AAP FQDN
            default: "{{ aap_fqdn }}"
            variable: aap_fqdn
            type: "text"
            required: false
          - question_name: AAP EDA Port
            default: "{{ aap_eda_port }}"
            variable: aap_eda_port
            type: "text"
            required: false
          - question_name: Splunk Alert Name
            default: "{{ alert_name }}"
            variable: alert_name
            "type": "text"
            required: false
          - question_name: Splunk Match Text
            default: "{{ match_text }}"
            variable: match_text
            "type": "text"
            required: false
  - name: "AWS Splunk: 03. Unsetup"
    description: ""
    organization: "Default"
    project: "AWS Splunk Project"
    inventory: "AWS Inventory"
    playbook: "aws_splunk_unsetup.yml"
    verbosity: 0
    job_type: "run"
    credentials:
      - "AWS Credential"
      - "AWS Splunk Credential"
      - "AWS Splunk Vault"
    execution_environment: "{{ ee_name }}"
    survey_enabled: true
    survey:
        name: Survey
        description: Survey
        spec:
          - question_name: Subscription User
            default: "{{ subscription_user }}"
            variable: subscription_user
            type: "text"
            required: true
          - question_name: Subscription Password
            default: "{{ subscription_pass }}"
            variable: subscription_pass
            type: "password"
            required: true
          - question_name: Subscription Pool Id
            default: "{{ rh_subs_pool_id }}"
            variable: rh_subs_pool_id
            type: "password"
            required: true
  - name: "AWS Splunk: 04. AWS Undeploy"
    description: ""
    organization: "Default"
    project: "AWS Splunk Project"
    inventory: "AWS Inventory"
    playbook: "aws_undeploy.yml"
    verbosity: 0
    job_type: "run"
    credentials:
      - "AWS Credential"
      - "AWS Splunk Credential"
  - name: "AWS Splunk: Restart Interface"
    description: ""
    organization: "Default"
    project: "AWS Splunk Project"
    inventory: "AWS Inventory"
    playbook: "aws_splunk_restart_int.yml"
    verbosity: 0
    job_type: "run"
    credentials:
      - "AWS Credential"
      - "AWS Splunk Credential"
  # AO WORKFLOW FORWARDERS
  - name: "AWS EDA Splunk: AO Forwarder"
    description: ""
    organization: "Default"
    project: "AWS Splunk Project"
    inventory: "AWS Inventory"
    playbook: "aws_splunk_ao_forwarder.yml"
    verbosity: 0
    job_type: "run"
    credentials:
      - "AWS Credential"
      - "AWS Splunk Credential"
    execution_environment: "{{ ee_name }}"
    survey_enabled: true
    survey:
        name: Survey
        description: Survey
        spec:
          - question_name: AO Workflow URL
            default: "{{ ao_webhook_url }}"
            variable: ao_webhook_url
            type: "text"
            required: false
          - question_name: AO Workflow Path
            default: "{{ ao_webhook_path }}"
            variable: ao_webhook_path
            type: "text"
            required: false
          - question_name: AO Workflow Client ID
            default: "{{ ao_webhook_client_id }}"
            variable: ao_webhook_client_id
            type: "password"
            required: false
          - question_name: AO Workflow Client Secret
            default: "{{ ao_webhook_client_secret }}"
            variable: ao_webhook_client_secret
            type: "password"
            required: false
    ask_variables_on_launch: true
    ask_labels_on_launch: true

# Workflow Job Templates
controller_workflows:
  - name: "AWS Splunk: Workflow"
    description: "AWS Splunk: Workflow"
    organization: "Default"
    state: "present"
    simplified_workflow_nodes:
      - identifier: "AWS Deploy"
        workflow_job_template: "AWS Splunk: Workflow"
        unified_job_template: "AWS Splunk: 01. AWS Deploy"
        organization: "Default"
        all_parents_must_converge: "False"
        always_nodes:
          - Splunk Setup
      - identifier: "Splunk Setup"
        workflow_job_template: "AWS Splunk: Workflow"
        unified_job_template: "AWS Splunk: 02. Setup"
        organization: "Default"
        all_parents_must_converge: "False"
        always_nodes:
          - Splunk Unsetup
      - identifier: "Splunk Unsetup"
        workflow_job_template: "AWS Splunk: Workflow"
        unified_job_template: "AWS Splunk: 03. Unsetup"
        organization: "Default"
        all_parents_must_converge: "False"
        always_nodes:
          - AWS Undeploy
      - identifier: "AWS Undeploy"
        workflow_job_template: "AWS Splunk: Workflow"
        unified_job_template: "AWS Splunk: 04. AWS Undeploy"
        organization: "Default"
        all_parents_must_converge: "False"

# EDA Projects
eda_projects:
  - name: "AWS EDA Splunk Project"
    description: "AWS EDA Splunk Project"
    organization: "Default"
    url: "{{ project_url }}"
    tls_validation: true
    sync: true

# EDA Rulebook Activations
eda_rulebook_activations:
  - name: "AWS EDA Splunk: Cisco"
    description: "AWS EDA Splunk: Cisco"
    organization: "Default"
    project: "AWS EDA Splunk Project"
    rulebook: "splunk_cisco_rulebook.yml"
    decision_environment: "{{ de_name }}"
    eda_credentials: "Controller Credentials"
    restart_policy: always
    #enabled: false
    log_level: info

